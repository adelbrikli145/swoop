name: Telegram manual test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-test-message:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send test Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID must be configured as repository secrets." >&2
            exit 1
          fi

          response="$(curl --fail-with-body --silent --show-error --max-time 20 \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Swoop Telegram test: manual GitHub Actions delivery check. No flight search was performed.")"

          if ! jq --exit-status '.ok == true' <<<"$response" >/dev/null; then
            echo "Telegram did not confirm delivery of the test message." >&2
            exit 1
          fi

          echo "Telegram confirmed delivery of the test message."
